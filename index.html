<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ครูฮูชวนเล่นอังกฤษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff4d6;--ink:#23305a;--card:#fff;--line:#23305a;--sun:#ffd84d;--mint:#6fdcae;--coral:#ff8a7a;--muted:#5b678f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Mali,"Noto Sans Thai",sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 48px}h1,h2,h3{font-family:Itim,Mali,sans-serif;font-weight:400;line-height:1.3;margin:0 0 12px}.hero,.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 5px 0 var(--line)}.hero{display:flex;align-items:center;gap:14px}.owl{font-size:58px}.note{color:var(--muted);font-size:15px}.who{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:14px 0}.who label{display:grid;color:var(--muted);font-size:15px}.who input{font:inherit;color:var(--ink);min-width:0;padding:9px 12px;border:3px solid var(--line);border-radius:14px}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grade,button{font:inherit;color:var(--ink);cursor:pointer}.grade{border:3px solid var(--line);border-radius:20px;padding:14px;background:#ffd1dc;box-shadow:0 5px 0 var(--line)}.grade:nth-child(2){background:#ffe0b5}.grade:nth-child(3){background:#fff3a8}.grade:nth-child(4){background:#c9f2c7}.grade:nth-child(5){background:#c4e4ff}.grade:nth-child(6){background:#e3d4ff}.grade span{display:block}.grade .em{font-size:34px}.grade .g{font:32px Itim}.btn{border:3px solid var(--line);border-radius:999px;background:var(--sun);padding:9px 20px;box-shadow:0 4px 0 var(--line);font:22px Itim,Mali,sans-serif}.btn:active,.grade:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin:10px 0;padding:12px 14px;min-height:56px;background:var(--card);border:3px solid var(--line);border-radius:18px}.choice b{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun)}.choice.right{background:#2fb87e;color:white}.choice.wrong{background:#f0605a;color:white}.center{text-align:center}.dots{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.hidden{display:none}button:focus-visible,input:focus-visible{outline:4px solid #6cc3ff;outline-offset:3px}@media(max-width:560px){main{padding:12px}.grades{grid-template-columns:repeat(2,1fr)}.who{grid-template-columns:1fr 1fr}.hero{padding:12px}.owl{font-size:46px}}
</style>
</head>
<body><main id="app" aria-live="polite"></main>
<script>
const QUIZZES=[
[{q:'“Dog” แปลว่าอะไร?',s:'dog',o:['สุนัข','แมว','ปลา'],a:0,w:'Dog คือสุนัข'}, {q:'สีแดง ภาษาอังกฤษคือคำไหน?',s:'red',o:['Blue','Red','Green'],a:1,w:'Red คือสีแดง'}, {q:'เลข 3 ภาษาอังกฤษคือคำไหน?',s:'three',o:['Two','Four','Three'],a:2,w:'Three คือสาม'}, {q:'“Apple” คือผลไม้อะไร?',s:'apple',o:['แอปเปิล','กล้วย','ส้ม'],a:0,w:'Apple คือแอปเปิล'}, {q:'ตอนเช้าทักทายกันว่าอะไร?',s:'Good morning',o:['Good night','Good morning','Goodbye'],a:1,w:'Good morning คือสวัสดีตอนเช้า'}],
[{q:'“Mother” คือใคร?',s:'mother',o:['พ่อ','ย่า','แม่'],a:2,w:'Mother คือแม่'}, {q:'ส่วนของร่างกายที่ใช้มองเห็นคือคำไหน?',s:'eye',o:['Ear','Eye','Nose'],a:1,w:'Eye คือตา'}, {q:'“Big” ตรงข้ามกับคำไหน?',s:'big',o:['Small','Tall','Hot'],a:0,w:'Big แปลว่าใหญ่ ตรงข้ามคือ small'}, {q:'This is ___ elephant.',o:['a','an','the'],a:1,w:'ใช้ an ก่อน elephant'}, {q:'“Book” แปลว่าอะไร?',s:'book',o:['ปากกา','กระเป๋า','หนังสือ'],a:2,w:'Book คือหนังสือ'}],
[{q:'I ___ a student.',o:['am','is','are'],a:0,w:'I ใช้คู่กับ am'}, {q:'She ___ a cat.',o:['have','has','haves'],a:1,w:'She ใช้ has'}, {q:'“What is your name?” ควรตอบว่าอะไร?',o:['I am fine.','It is red.','My name is Mai.'],a:2,w:'ถามชื่อ ตอบชื่อได้ เช่น My name is Mai.'}, {q:'วันหลังวันจันทร์ (Monday) คือวันอะไร?',s:'Monday',o:['Tuesday','Sunday','Friday'],a:0,w:'Monday แล้วต่อด้วย Tuesday'}, {q:'“It is raining.” หมายถึงอะไร?',s:'It is raining',o:['แดดออก','หิมะตก','ฝนตก'],a:2,w:'It is raining หมายถึงฝนกำลังตก'}],
[{q:'Where ___ you live?',o:['do','does','is'],a:0,w:'ใช้ do กับ you'}, {q:'เวลา 8:00 พอดี พูดว่าอย่างไร?',o:['Eighteen','Eight o’clock','Eighty'],a:1,w:'Eight o’clock คือแปดนาฬิกาตรง'}, {q:'เพื่อนพูด “Thank you.” เราควรตอบว่าอะไร?',o:['Sorry.','Goodbye.','You’re welcome.'],a:2,w:'You’re welcome คือยินดี/ไม่เป็นไร'}, {q:'คำตรงข้ามของ “hot” คือคำไหน?',o:['Cold','Warm','Hat'],a:0,w:'Hot คือร้อน ตรงข้ามคือ cold'}, {q:'There ___ three books on the table.',o:['is','are','am'],a:1,w:'Books เป็นพหูพจน์ จึงใช้ are'}],
[{q:'He ___ to school every day.',o:['go','going','goes'],a:2,w:'He ใช้ goes'}, {q:'อดีตของ “eat” คือคำไหน?',o:['ate','eated','eaten'],a:0,w:'อดีตของ eat คือ ate'}, {q:'I am taller ___ you.',o:['then','than','that'],a:1,w:'ใช้ than ในการเปรียบเทียบ'}, {q:'“What are you doing?” ควรตอบแบบไหน?',o:['I read a book yesterday.','I will read tomorrow.','I am reading a book.'],a:2,w:'กำลังทำ ใช้ am/is/are + กริยาเติม ing'}, {q:'“beautiful” เป็นคำชนิดใด?',o:['คำกริยา','คำคุณศัพท์','คำนาม'],a:1,w:'Beautiful เป็นคำคุณศัพท์'}],
[{q:'If it rains, we ___ at home.',o:['will stay','stayed','staying'],a:0,w:'ใช้ will + กริยาช่อง 1'}, {q:'I have lived here ___ 2020.',o:['for','ago','since'],a:2,w:'Since ใช้กับจุดเวลา'}, {q:'The book ___ by many children.',o:['reads','is read','reading'],a:1,w:'Passive ใช้ is/are + กริยาช่อง 3'}, {q:'พหูพจน์ของ “child” คือคำไหน?',o:['childs','childrens','children'],a:2,w:'พหูพจน์ของ child คือ children'}, {q:'I was tired, ___ I went to bed early.',o:['so','but','or'],a:0,w:'So ใช้บอกผล'}]
];
const grades=['ป.1','ป.2','ป.3','ป.4','ป.5','ป.6'],emojis=['🐶','👨‍👩‍👧','🏫','⏰','📖','✍️'];let app=document.getElementById('app'),name=localStorage.getItem('owl_name')||'',cls=localStorage.getItem('owl_class')||'',quiz=[],index=0,score=0,locked=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML='<section class="hero"><div class="owl">🦉</div><div><h1>Hello! สวัสดีจ้ะ</h1><p class="note">กรอกชื่อ แล้วเลือกชั้นเรียนเพื่อเริ่มเล่น</p></div></section><div class="who"><label>ชื่อของหนู<input id="nm" maxlength="30" value="'+esc(name)+'" placeholder="ชื่อเล่น"></label><label>ห้อง<input id="cl" maxlength="10" value="'+esc(cls)+'" placeholder="ป.3/1"></label></div><h2>เลือกชั้นเรียน</h2><section class="grades">'+grades.map((g,i)=>'<button class="grade" data-grade="'+i+'"><span class="em">'+emojis[i]+'</span><span class="g">'+g+'</span><span>'+['คำศัพท์แรก','ครอบครัวและร่างกาย','ประโยคง่ายๆ','คำถามและเวลา','ไวยากรณ์พื้นฐาน','อ่านและเขียน'][i]+'</span></button>').join('')+'</section><section class="card"><b>⭐ แต้มสะสม: '+(Number(localStorage.getItem('owl_points'))||0)+'</b><p class="note">เล่นแบบทดสอบเพื่อฝึกภาษาอังกฤษและรับแต้ม!</p></section>';
app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{name=document.getElementById('nm').value.trim();cls=document.getElementById('cl').value.trim();if(!name){document.getElementById('nm').focus();alert('พิมพ์ชื่อก่อนนะ');return}localStorage.setItem('owl_name',name);localStorage.setItem('owl_class',cls);start(+b.dataset.grade)})}
function start(g){quiz=QUIZZES[g].map(q=>({...q,o:q.o.map((t,i)=>({t,ok:i===q.a})).sort(()=>Math.random()-.5)}));index=0;score=0;locked=false;showQuestion(g)}
function showQuestion(g){if(index>=quiz.length){finish(g);return}locked=false;const q=quiz[index];app.innerHTML='<div class="dots">'+grades[g]+' · ข้อ '+(index+1)+' จาก '+quiz.length+'</div><section class="card"><h2>'+q.q+'</h2>'+(q.s?'<button class="btn" id="say">🔊 ฟังเสียง</button>':'')+'</section><div>'+q.o.map((x,i)=>'<button class="choice" data-choice="'+i+'"><b>'+['ก','ข','ค'][i]+'</b><span>'+x.t+'</span></button>').join('')+'</div><p id="feedback" class="note"></p><div class="actions"><button class="btn" id="back">กลับหน้าแรก</button></div>';
const say=document.getElementById('say');if(say)say.onclick=()=>{const u=new SpeechSynthesisUtterance(q.s);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)};document.getElementById('back').onclick=home;
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const chosen=q.o[+b.dataset.choice];if(chosen.ok)score++;app.querySelectorAll('[data-choice]').forEach((x,i)=>{x.disabled=true;if(q.o[i].ok)x.classList.add('right');else if(x===b)x.classList.add('wrong')});document.getElementById('feedback').textContent=(chosen.ok?'เก่งมาก! ถูกต้อง — ':'ไม่เป็นไรนะ เฉลยคือ — ')+q.w+'  ';const next=document.createElement('button');next.className='btn';next.textContent=index===quiz.length-1?'ดูคะแนน':'ข้อต่อไป';next.onclick=()=>{index++;showQuestion(g)};document.getElementById('feedback').appendChild(next)})}
function finish(g){const earned=score*2,points=(Number(localStorage.getItem('owl_points'))||0)+earned;localStorage.setItem('owl_points',points);app.innerHTML='<section class="card center"><div class="owl">🦉</div><h2>เก่งมาก '+esc(name)+'!</h2><p>ได้ '+score+' จาก '+quiz.length+' ข้อ</p><p>'+('⭐'.repeat(Math.max(1,Math.round(score/quiz.length*5))))+'</p><p>ได้รับ '+earned+' แต้ม · แต้มสะสม '+points+'</p><div class="actions"><button class="btn" id="again">เล่นอีกครั้ง</button><button class="btn" id="home">กลับหน้าแรก</button></div></section>';document.getElementById('again').onclick=()=>start(g);document.getElementById('home').onclick=home}
home();
</script></main></body></html>
